[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccermaster"
version = "0.1.0"
description = "SoccerMaster: a unified soccer vision foundation model and game-state reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haolin Yang et al." }]
dependencies = [
    # Floors only, no upper bounds: hosted runtimes (Colab, Kaggle) ship a modern
    # CUDA-matched torch, and an upper bound here makes the package uninstallable
    # there. Upstream was developed against torch 2.4.1 / torchvision 0.19.1.
    "torch>=2.4",
    "torchvision>=0.19",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "accelerate>=1.8",
    "transformers>=4.49",
    "timm>=1.0",
    "einops>=0.8",
    "safetensors>=0.4",
    "pandas>=2.0",
    "numpy>=1.24,<3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "ultralytics==8.0.100",
    "albumentations==1.4.19",
    "lightning>=2.0",
    "filterpy>=1.4",
    "lap>=0.5",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.24",
    "rich>=13.0",
    "yacs>=0.1.8",
    "gdown>=5.0",
    "pyyaml>=6.0",
    "qwen-vl-utils[decord]==0.0.8",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "scipy>=1.10",
    "pyarrow>=14.0",
    # On the model import path (soccermaster.model.models.multi_task pulls in the data
    # modules, which import matplotlib, sympy and the ellipse fitter).
    "matplotlib>=3.8",
    "sympy>=1.12",
    # NOT `ellipse` on PyPI -- that is an unrelated project about pictures of ellipses.
    # The package that provides `from ellipse import LsqEllipse` is `lsq-ellipse`.
    "lsq-ellipse>=2.2",
]

[project.optional-dependencies]
# Everything the 3-step game-state pipeline imports at runtime (step 1 and 3).
# Step 2 additionally needs the `sam2` extra plus the vendored third_party/sam2.
pipeline = [
    "soccernet>=0.1.55",
    "torchreid @ git+https://github.com/VlSomers/bpbreid",
    "prtreid @ git+https://github.com/VlSomers/prtreid",
    "poseval @ git+https://github.com/TrackingLaboratory/poseval@pbtrack",
    # NB: no torchmetrics here on purpose. prtreid pins torchmetrics==0.10.3, and
    # tracker/eval imports pull it in transitively; declaring >=1.3 makes the whole
    # install unresolvable (ResolutionImpossible).
    "pycocotools>=2.0",
    "xmltodict>=0.13",
    "shapely>=2.0",
    "scikit-image>=0.22",
    "requests>=2.31",
    "yt-dlp>=2023.12",
]
sam2 = [
    "iopath>=0.1.10",
]
# TVCalib calibration backend (not used by the default nbjw_calib configs).
tvcalib = [
    "kornia==0.6.3",
    "pytorch-lightning>=2.0",
    "seaborn>=0.13",
]
train = [
    "flash-attn>=2.6",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
soccermaster = "soccermaster.cli:main"

[project.entry-points."hydra.plugins.search_path_plugin"]
soccermaster = "soccermaster.tracklab.searchpath_plugin:SoccerMasterSearchPathPlugin"

[project.entry-points.soccermaster_plugin]
soccermaster = "soccermaster.soccernet_gamestate.config_finder:ConfigFinder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soccermaster = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.npy", "**/*.png"]
