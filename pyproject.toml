[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "soccermaster"
# Version comes from the git tag via setuptools-scm -- no hand-edited number to
# forget. Tag `v1.0.1-alpha` becomes version `1.0.1a0` (verified: setuptools-scm
# normalises the `-alpha` suffix to PEP 440). Pushing a tag is what triggers the
# release workflow.
dynamic = ["version"]
description = "SoccerMaster: a unified soccer vision foundation model and game-state reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haolin Yang et al." }]
dependencies = [
    # Floors only, no upper bounds: hosted runtimes (Colab, Kaggle) ship a modern
    # CUDA-matched torch, and an upper bound here makes the package uninstallable
    # there. Upstream was developed against torch 2.4.1 / torchvision 0.19.1.
    "torch>=2.4",
    "torchvision>=0.19",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "accelerate>=1.8",
    # transformers 5.x flattened SiglipVisionModel (no `.vision_model` submodule).
    # 4.57.6 is also unusable: SiglipVisionModel.from_pretrained dies inside
    # initialize_weights with "smart_apply() missing 1 required positional argument:
    # 'is_custom_code'". 4.51.3 is verified working end to end (model loads, forward
    # pass runs), and it is the first release with both SigLIP 2 and Qwen2.5-VL.
    "transformers>=4.49,<4.52",
    "timm>=1.0",
    "einops>=0.8",
    "safetensors>=0.4",
    "pandas>=2.0",
    "numpy>=1.24,<3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "ultralytics==8.0.100",
    # `ultralytics` 8.0.100 does a top-level `import pkg_resources`
    # (yolo/utils/checks.py). `pkg_resources` ships inside setuptools; Python 3.12+ no
    # longer installs setuptools into a fresh environment, and setuptools 81 removed
    # `pkg_resources` outright (84.0.0 verified: ModuleNotFoundError). So this has to be
    # declared *and* bounded. Without it `import ultralytics` dies on a clean 3.12/3.13
    # interpreter, which is how the detector step failed in CI while working on Colab
    # (Colab preinstalls setuptools). setuptools' own deprecation notice says: "Refrain
    # from using this package or pin to Setuptools<81".
    "setuptools>=68,<81",
    "albumentations==1.4.19",
    "lightning>=2.0",
    "filterpy>=1.4",
    "lap>=0.5",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.24",
    "rich>=13.0",
    "yacs>=0.1.8",
    "gdown>=5.0",
    "pyyaml>=6.0",
    "qwen-vl-utils[decord]==0.0.8",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "scipy>=1.10",
    "pyarrow>=14.0",
    # On the model import path (soccermaster.model.models.multi_task pulls in the data
    # modules, which import matplotlib, sympy and the ellipse fitter).
    "matplotlib>=3.8",
    "sympy>=1.12",
    # NOT `ellipse` on PyPI -- that is an unrelated project about pictures of ellipses.
    # The package that provides `from ellipse import LsqEllipse` is `lsq-ellipse`.
    "lsq-ellipse>=2.2",
]

[project.optional-dependencies]
# Everything the 3-step game-state pipeline imports at runtime (step 1 and 3).
# Step 2 additionally needs the `sam2` extra plus the vendored third_party/sam2.
pipeline = [
    "soccernet>=0.1.55",
    "torchreid @ git+https://github.com/VlSomers/bpbreid",
    "prtreid @ git+https://github.com/VlSomers/prtreid",
    "poseval @ git+https://github.com/TrackingLaboratory/poseval@pbtrack",
    # NB: no torchmetrics here on purpose. prtreid pins torchmetrics==0.10.3, and
    # tracker/eval imports pull it in transitively; declaring >=1.3 makes the whole
    # install unresolvable (ResolutionImpossible).
    "pycocotools>=2.0",
    "xmltodict>=0.13",
    "shapely>=2.0",
    "scikit-image>=0.22",
    "requests>=2.31",
    "yt-dlp>=2023.12",
]
sam2 = [
    "iopath>=0.1.10",
    # SAM 2 itself is vendored at third_party/sam2 and is NOT part of this distribution's
    # wheel -- packages are discovered under src/ only, so the vendored tree ships in the
    # sdist but is never installed. It therefore has to be requested from the repository
    # subdirectory, otherwise `import sam2` fails in soccermaster/sam2_refine and step 2
    # cannot start. Previously this extra declared only iopath, so installing it looked
    # like it had enabled step 2 while nothing provided the package.
    #
    # SAM2_BUILD_CUDA=0 is recommended: the CUDA extension needs nvcc, which most hosts
    # (including the Modal image) lack. setup.py catches a failed build and warns rather
    # than failing, so this degrades gracefully, but skipping the attempt saves a pointless
    # compile. The extension accelerates mask connected-components; the video predictor
    # works without it.
    "sam2 @ git+https://github.com/SurrealisticRabbit/SoccerMaster@main#subdirectory=third_party/sam2",
]
# TVCalib calibration backend (not used by the default nbjw_calib configs).
tvcalib = [
    "kornia==0.6.3",
    "pytorch-lightning>=2.0",
    "seaborn>=0.13",
]
train = [
    "flash-attn>=2.6",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "build>=1.2",
]

[project.scripts]
soccermaster = "soccermaster.cli:main"

[project.entry-points.soccermaster_plugin]
soccermaster = "soccermaster.soccernet_gamestate.config_finder:ConfigFinder"

# NOTE: there is deliberately no "hydra.plugins.search_path_plugin" entry point.
# Hydra does not read that group -- it imports a top-level package named
# `hydra_plugins` and scans it (hydra.core.plugins.Plugins._initialize). An entry
# point here looks correct but is silently ignored, which is how config discovery
# was broken: the gsr_* configs were unreachable. The plugin lives in
# src/hydra_plugins/soccermaster_searchpath_plugin/ instead.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soccermaster = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.npy", "**/*.png"]

[tool.setuptools_scm]
# Version is derived from the git tag. Any commit after a tag gets a local version
# segment (e.g. 1.0.1a0+g3489a1c), so builds are traceable to a commit.
version_file = "src/soccermaster/_version.py"
# Keeps `pip install` working from an exported tarball or a shallow clone with no
# tags reachable, instead of failing outright.
fallback_version = "0.0.0+unknown"
# `guess-next-dev` (the default) reports commits after v1.0.1-alpha as 1.0.1a1.devN,
# i.e. it claims the next alpha. `no-guess-dev` reports 1.0.1a0.post1.devN, which is
# what those commits actually are. Verified: both give exactly 1.0.1a0 at the tag,
# which is the property that matters -- the released artefact carries the tag's
# version, not a guess.
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is a smoke/regression suite, not exhaustive coverage: it checks that the
# package imports, that the Hydra configs compose and every _target_ resolves, that
# paths are retargeted, and that the exporter round-trips. Those are the failures this
# project actually hit, and they are all runnable on CPU with no weights and no GPU.
addopts = "-ra --strict-markers"
markers = [
    "heavy: needs the pipeline extra (torch/pandas/hydra). Skipped automatically when absent.",
]
