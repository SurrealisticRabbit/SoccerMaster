[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccermaster"
version = "0.1.0"
description = "SoccerMaster: a unified soccer vision foundation model and game-state reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haolin Yang et al." }]
dependencies = [
    "torch>=2.4,<2.6",
    "torchvision>=0.19,<0.21",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "accelerate>=1.8",
    "transformers>=4.49",
    "timm>=1.0",
    "einops>=0.8",
    "safetensors>=0.4",
    "pandas>=2.0",
    "numpy>=1.24,<3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "ultralytics==8.0.100",
    "albumentations==1.4.19",
    "lightning>=2.2",
    "filterpy>=1.4",
    "lap>=0.5",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.24",
    "rich>=13.0",
    "yacs>=0.1.8",
    "gdown>=5.0",
    "pyyaml>=6.0",
    "qwen-vl-utils[decord]==0.0.8",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "scipy>=1.10",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
sam2 = [
    "iopath>=0.1.10",
    "matplotlib>=3.8",
]
train = [
    "flash-attn>=2.6",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
soccermaster = "soccermaster.cli:main"

[project.entry-points."hydra.plugins.search_path_plugin"]
soccermaster = "soccermaster.tracklab.searchpath_plugin:SoccerMasterSearchPathPlugin"

[project.entry-points.soccermaster_plugin]
soccermaster = "soccermaster.soccernet_gamestate.config_finder:ConfigFinder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soccermaster = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.npy", "**/*.png"]
