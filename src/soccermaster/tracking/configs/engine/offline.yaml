_target_: soccermaster.tracking.engine.OfflineTrackingEngine

num_workers: ${num_cores}
callbacks:
  progress:
    _target_: soccermaster.tracking.callbacks.Progressbar
    use_rich: ${use_rich}
  ignored_regions:
    _target_: soccermaster.tracking.callbacks.IgnoredRegions
    max_intersection: 0.9
  vis: ${visualization}
