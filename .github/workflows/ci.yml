name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core install is what every notebook does, so validating that it *resolves* is
  # half the value here: an upper bound on torchvision made the package uninstallable
  # on Python 3.13, and only a real install catches that.
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor and what upstream targeted (where the mutable-dataclass
        # bug does not fire); 3.13 is what Colab runs and where it does.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tags, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Version metadata
        run: |
          python -c "import soccermaster; print('version:', soccermaster.__version__)"
          python -c "import soccermaster, sys; assert 'torch' not in sys.modules, 'import is not lazy'"

      - name: Tests
        run: pytest -q

  # The pipeline extra pulls prtreid/torchreid/poseval from git and compiles wheels, so
  # it is slow and the odd transient network failure is not worth blocking a push over.
  # This job is the one that would catch a broken _target_ or a missing declared dep.
  test-pipeline:
    name: tests with the pipeline extra
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches what the Modal image uses
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pipeline,dev]"

      - name: Pre-flight
        run: python -m soccermaster doctor --steps 1,3 || true

      - name: Tests
        run: pytest -q
